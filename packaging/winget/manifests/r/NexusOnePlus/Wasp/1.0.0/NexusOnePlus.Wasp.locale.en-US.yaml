ShortDescription: A fast, native, unofficial WhatsApp desktop client for Windows.
Description: |-
  Wasp is a native Windows app for WhatsApp, written in Rust and drawn on the GPU, with no embedded browser.
  It links to your phone as a linked device, the same way WhatsApp Web does, and keeps running in the tray so messages and calls still reach you.
  Wasp is unofficial and is not affiliated with WhatsApp LLC or Meta Platforms, Inc.
