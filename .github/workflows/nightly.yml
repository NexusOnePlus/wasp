# Rolling build of main. The `nightly` tag is moved on every push, so the
# release page always holds exactly one set of development binaries.
name: Nightly

on:
  # Manual only: releases are published from a Windows machine with
  # packaging/windows/build-release.ps1, and nothing here may create,
  # replace or delete a release (or a site) on a push.
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

# Read for everything by default; the publish job below raises its own to
# `contents: write`, which is the only thing here that needs it.
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: nightly

  # The same client as a page used to be published from here too. The app
  # ships to Windows only; the web bundle is still buildable by hand through
  # `web-bundle.yml`, and the Pages workflow is unchanged.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum wasp-* Wasp-* > checksums.sha256)
          cat > notes.md <<'NOTES'
          Unsigned development build of `main`. Expect breakage.

          Download `wasp-nightly-windows-x86_64.zip` and unpack it. It holds
          three binaries that belong together, and they must stay in the same
          directory:

          - `wasp` is the window.
          - `waspd` holds the WhatsApp session. The window starts it when
            nothing is already running.
          - `wasp-cli` is the scriptable front end onto that same daemon,
            for use from a terminal or a script.

          `Wasp-Setup-nightly-x64.exe` installs the same three binaries for the
          current user, with no administrator prompt.

          SmartScreen will object to both. The binaries are unsigned.
          NOTES
          echo "" >> notes.md
          echo "Built from [\`${GITHUB_SHA:0:7}\`](https://github.com/$GH_REPO/commit/$GITHUB_SHA) on $(date -u +"%Y-%m-%d %H:%M") UTC." >> notes.md
          echo "" >> notes.md
          echo "Verify download integrity with \`sha256sum -c --ignore-missing checksums.sha256\`." >> notes.md
          # Recreate rather than edit: `gh release edit` cannot move a tag, and
          # a stale tag would leave the assets pointing at an older commit.
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly artifacts/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly (${GITHUB_SHA:0:7})" \
            --notes-file notes.md
